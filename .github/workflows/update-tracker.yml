name: Update Project Tracker Sheet

on:
  schedule:
    # Runs daily at 8:00 AM UTC
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  update-sheet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r .github/scripts/project-tracker/requirements.txt

      - name: Debug - List files (optional but helpful)
        run: ls -R .github/scripts/

      - name: Update Google Sheet
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          REPO_OWNER: HiddenDarkViper07
          REPO_NAME: ESP-Website
        run: |
          # Clear Python cache files
          echo "Clearing Python cache..."
          find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find . -type f -name "*.pyc" -delete 2>/dev/null || true
          
          # Clear any cached script files
          echo "Cache cleared. Running script..."
          python .github/scripts/project-tracker/update_project_sheet.py
